<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b36" />
    <meta name="description" content="مرشدي HG — تعلّم التاريخ والجغرافيا باللعب: ثمانية أطوار، دليل منهجي، وخرائط توطين تفاعلية وأوراق تحرير مرمزة بكود QR." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>مرشدي HG — التاريخ والجغرافيا</title>
    <style>
      html { background: #052a26; }
      body { margin: 0; }
      #splash {
        position: fixed; inset: 0; z-index: 99; overflow: hidden;
        display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center;
        padding: 24px 18px calc(18px + env(safe-area-inset-bottom));
        background:
          radial-gradient(120% 90% at 50% -12%, #12857c 0%, #0b4a43 40%, #062e2a 74%, #041d1a 100%);
        color: #eafffb; font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash::before {
        content: ""; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        -webkit-mask-image: radial-gradient(80% 62% at 50% 42%, #000 15%, transparent 78%);
        mask-image: radial-gradient(80% 62% at 50% 42%, #000 15%, transparent 78%);
      }
      .splash-glow {
        position: absolute; top: 10%; width: min(80vw, 520px); aspect-ratio: 1; border-radius: 50%;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.4), rgba(45, 212, 191, 0) 66%);
        filter: blur(18px);
      }
      .splash-card {
        position: relative; display: flex; flex-direction: column; align-items: center;
        gap: 13px; padding: 26px 30px 22px; border-radius: 26px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 26px 64px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      }
      .splash-logo svg {
        display: block; width: clamp(130px, 40vw, 178px); height: auto;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.4));
      }
      .splash-logo .globe-spin { animation: globe 18s linear infinite; transform-origin: 120px 120px; }
      .splash-card h1 {
        margin: 0; font-size: clamp(19px, 5.2vw, 25px); font-weight: 700; letter-spacing: 0;
        text-align: center; line-height: 1.45;
        background: linear-gradient(180deg, #ffffff, #b9f4ea);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .splash-card .sub { margin: 0; font-size: 12.5px; color: rgba(214, 247, 241, 0.72); }
      .splash-bar { width: 136px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .splash-bar i {
        display: block; width: 42%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #5eead4, #ffffff);
        animation: slide 1.35s ease-in-out infinite;
      }
      .splash-foot {
        position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding: 0 8px; text-align: center;
      }
      .splash-foot .year { font-size: 12.5px; color: rgba(214, 247, 241, 0.78); }
      .splash-foot .dev {
        font-size: 11.5px; letter-spacing: 0.14em; direction: ltr;
        color: rgba(255, 255, 255, 0.92); font-weight: 600;
      }
      @keyframes globe { to { transform: rotate(360deg); } }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        55%, 100% { transform: translateX(240%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo .globe-spin, .splash-bar i { animation: none; }
      }
      @media (max-height: 560px) {
        .splash-card { padding: 16px 20px 14px; gap: 9px; }
        .splash-logo svg { width: 104px; }
        .splash-card .sub { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="جارٍ تحميل التطبيق">
      <div class="splash-glow"></div>
      <div class="splash-card">
        <div class="splash-logo">
          <svg viewBox="0 0 240 240" aria-hidden="true">
            <defs>
              <radialGradient id="sGlobe" cx="34%" cy="28%" r="78%">
                <stop offset="0" stop-color="#9df5e6" />
                <stop offset="42%" stop-color="#2dd4bf" />
                <stop offset="78%" stop-color="#0e9488" />
                <stop offset="100%" stop-color="#064e46" />
              </radialGradient>
              <radialGradient id="sShine" cx="32%" cy="24%" r="55%">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="sNeedle" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
                <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55" />
                <stop offset="1" stop-color="#ffffff" stop-opacity="0.18" />
              </linearGradient>
            </defs>

            <circle cx="120" cy="120" r="94" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" />
            <g class="globe-spin">
              <circle cx="120" cy="120" r="82" fill="url(#sGlobe)" />
              <g fill="none" stroke="#eafffb" stroke-opacity="0.4" stroke-width="1.5">
                <ellipse cx="120" cy="120" rx="82" ry="82" />
                <ellipse cx="120" cy="120" rx="56" ry="82" />
                <ellipse cx="120" cy="120" rx="28" ry="82" />
                <path d="M38 120h164" />
                <ellipse cx="120" cy="120" rx="82" ry="34" />
                <ellipse cx="120" cy="120" rx="82" ry="60" />
              </g>
              <path d="M120 38a82 82 0 0 1 0 164 82 82 0 0 1 0-164z" fill="url(#sShine)" />
            </g>

            <g>
              <circle cx="120" cy="120" r="40" fill="#04211f" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4" />
              <circle cx="120" cy="120" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" />
              <path d="M120 82 L130 118 L120 158 L110 118 Z" fill="url(#sNeedle)" />
              <path d="M82 120 L118 110 L158 120 L118 130 Z" fill="#ffffff" fill-opacity="0.42" />
              <path d="M120 82 L124 108 L120 118 L116 108 Z" fill="#ffffff" fill-opacity="0.95" />
              <circle cx="120" cy="120" r="5.5" fill="#0b3b36" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.6" />
              <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
                <path d="M120 74v6M120 160v6M74 120h6M160 120h6" />
              </g>
            </g>
          </svg>
        </div>
        <h1>مرشدي في التاريخ والجغرافيا</h1>
        <p class="sub">دروس · دليل منهجي · خرائط تفاعلية</p>
        <div class="splash-bar"><i></i></div>
      </div>
      <div class="splash-foot">
        <span class="year">السنة الدراسية 2026 / 2027</span>
        <span class="dev">PR.AZIZ-BOUHOUCH</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
