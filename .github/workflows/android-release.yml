name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "Missing one of ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets." >&2
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Capacitor
        working-directory: cap
        run: npm install --no-audit --no-fund

      - name: Copy latest web app into www
        working-directory: cap
        run: node copy-web.js

      - name: Add Android platform project
        working-directory: cap
        run: |
          rm -rf android
          npx cap add android

      - name: Inject camera/storage permissions into manifest
        working-directory: cap
        run: node add-permissions.js

      - name: Inject release signingConfig into build.gradle
        working-directory: cap
        run: node add-signing.js

      - name: Place keystore and properties
        working-directory: cap/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > sijil-release.keystore
          {
            echo "storeFile=sijil-release.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_PASS"
          } > keystore.properties
          ls -la sijil-release.keystore

      - name: Sync Capacitor
        working-directory: cap
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: cap/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Locate release APK
        id: findapk
        working-directory: cap/android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No release APK produced" >&2; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp -f "$APK" "$GITHUB_WORKSPACE/sijil-taqyim-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sijil-android-release-apk
          path: cap/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create/publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "إصدار أندرويد موقّع (build ${{ github.run_number }})"
          files: sijil-taqyim-release.apk
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
