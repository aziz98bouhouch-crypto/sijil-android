name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'cap/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Capacitor
        working-directory: cap
        run: npm install --no-audit --no-fund

      - name: Copy latest web app into www
        working-directory: cap
        run: node copy-web.js

      - name: Add Android platform project
        working-directory: cap
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        working-directory: cap
        run: npx cap sync android

      - name: Build debug APK
        working-directory: cap/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Rename APK
        working-directory: cap/android/app/build/outputs/apk/debug
        run: |
          mkdir -p out
          cp -f app-debug.apk out/sijil-taqyim-android.apk || true
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sijil-android-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
