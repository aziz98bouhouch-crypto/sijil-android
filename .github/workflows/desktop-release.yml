name: Build & Publish Desktop Release (auto-update)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve version
        shell: bash
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer (no publish)
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --publish never 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::electron-builder failed (exit $code)."
            { echo "## electron-builder failed (exit $code)"; echo '```'; tail -n 80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build.log
          fi
          exit "$code"

      - name: Show built artifacts
        shell: bash
        run: ls -la release/*.exe release/*.yml release/*.blockmap 2>&1 || true

      - name: Publish single GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
